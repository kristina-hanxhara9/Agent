name: Test

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate JSON schema syntax
        run: node -e "JSON.parse(require('fs').readFileSync('configs/extraction-schema.json','utf-8'));console.log('schema OK')"

      - name: Validate agent YAML
        run: node -e "console.log('skipping yaml lint — install js-yaml to enable')"

      - name: Run unit tests
        run: npm test --if-present

      - name: Verify orchestrator help
        run: node src/orchestrator.js --help
